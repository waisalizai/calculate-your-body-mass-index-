<!DOCTYPE html>
<html lang="en">
<head>

    <title>BMI Calculator</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playwrite+NO:wght@100..400&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.25.19/dist/css/uikit.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.25.19/dist/js/uikit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.25.19/dist/js/uikit-icons.min.js"></script>

</head>

<body>
    
    <div class="uk-container uk-width-3-5@m uk-margin-top">

    <h1> Calculate your body mass index (BMI) for adults </h1>
 
    

    <h2> BMI Calculator </h2>

    <form class="uk-form-stacked">

        <div>
            <label class="uk-form-label" for="weight"> Weight (kg)</label>
            <div class="uk-form-controls">
                <input class="uk-input" id="weight" type="number" placeholder="e.g. 70">
            </div>
        </div>


        <div class="uk-margin">
            <div class="uk-form-label" for="height"> Height (cm)</div>
            <div class="uk-form-controls">
                <input class="uk-input" id="height" type="number" placeholder="e.g. 175">
            </div>
        </div>

    </form>

    <button class="uk-button uk-button-default" onclick="calculateBmi()">Submit</button>
    <button class="uk-button uk-button-default" onclick="clearFields()">Clear</button>
    <h4 id="heading"></h4>
    <p id="bmi-output"></p>
    <p id="message"></p>

    <script src="script.js"></script>
</div>
</body>
</html>
