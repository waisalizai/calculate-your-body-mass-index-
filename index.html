<body>

    <h1> Calculate your body mass index (BMI) for adults </h1>


    <p> Use this service to check the BMI of an adult aged 18 and over. However, you should not use this tool to diagnose any symptoms. If you are worried about your weight, contact your local pharmacist or GP surgery. </p>

    
    <h2> BMI Calculator </h2>

    <label for="weight">Weight (kg) </label>
    <input id="weight" type="number"> <br/>
    <label for="height"> Height (cm) </label>
    <input id="height" type="number"> <br/>
    <button onclick="calculateBmi ()"> Submit </Button>
    <button onclick="reload()"> Clear </button>
    
    <h4 id="heading"> </h4>
    <p id="bmi-output"> </p>
    <p id="message"> </p>

   <script src="script.js"></script>
    
</body>
</html>
